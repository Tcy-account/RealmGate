spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/realmgate
    username: realmgate
    password: realmgate
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      # 生产/测试环境务必设置密码，dev 本地可留空
      password:
      database: 0

  jpa:
    show-sql: true

logging:
  level:
    com.realmgate: DEBUG
    org.springframework.security: INFO

# Phase 2：JWT 配置。secret 为 HS256 密钥（base64 串，解码后 32 字节）。
# ⚠️ 仅本地学习用。生产环境必须换成强随机密钥且通过环境变量/密钥管理注入，禁止明文入库或提交。
realmgate:
  jwt:
    secret: VSch9LLncFXrSRWk1wh4hPIvmmOfTu/7gFYTpSCx2MA=
    expiration-minutes: 60
