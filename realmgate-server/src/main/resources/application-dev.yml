spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/realmgate}
    username: ${SPRING_DATASOURCE_USERNAME:realmgate}
    # Local default matches docker-compose POSTGRES_PASSWORD; override in prod.
    password: ${SPRING_DATASOURCE_PASSWORD:realmgate}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Leave empty for local redis without auth; set in non-dev environments.
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0

  jpa:
    show-sql: true

logging:
  level:
    com.realmgate: DEBUG
    org.springframework.security: INFO

# Phase 2: JWT. secret is HS256 key (base64, >=32 bytes after decode).
# Override REALMGATE_JWT_SECRET for anything beyond local learning. Do not commit real secrets.
realmgate:
  jwt:
    secret: ${REALMGATE_JWT_SECRET:ZGV2LW9ubHktcGxhY2Vob2xkZXItand0LXNlY3JldC0zMmJ5dGVzIQ==}
    expiration-minutes: ${REALMGATE_JWT_EXPIRATION_MINUTES:60}